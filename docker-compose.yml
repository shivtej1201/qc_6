# Single-box deployment (blueprint §9.1). `docker compose up --build`
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: qc6, POSTGRES_DB: qc6 }
    volumes: [ "pg:/var/lib/postgresql/data" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 20 }
  migrate:
    build: .
    command: ["python", "-m", "qc6.db.migrate"]
    environment: { QC6_DATABASE_URL: "postgresql://postgres:qc6@postgres:5432/qc6" }
    depends_on: { postgres: { condition: service_healthy } }
  api:
    build: .
    environment: { QC6_DATABASE_URL: "postgresql://postgres:qc6@postgres:5432/qc6" }
    ports: [ "8003:8003" ]
    volumes: [ "data:/data" ]
    depends_on: { migrate: { condition: service_completed_successfully } }
  worker:
    build: .
    command: ["python", "-m", "qc6.workers.runner"]
    environment: { QC6_DATABASE_URL: "postgresql://postgres:qc6@postgres:5432/qc6", QC6_VISITORS_PER_HOST: "6" }
    volumes: [ "data:/data" ]
    shm_size: "1gb"
    depends_on: { migrate: { condition: service_completed_successfully } }
  # HTTPS in front (CrawlPulse system architecture: reverse proxy / TLS termination). Optional:
  #   QC6_DOMAIN=qc.example.com docker compose --profile https up -d
  # Caddy gets and renews the certificate itself (ports 80 and 443 must reach this machine).
  https:
    image: caddy:2.8
    profiles: [ "https" ]
    environment: { QC6_DOMAIN: "${QC6_DOMAIN:-localhost}" }
    ports: [ "80:80", "443:443" ]
    volumes: [ "./deploy/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy:/data" ]
    depends_on: [ api ]
volumes: { pg: {}, data: {}, caddy: {} }
